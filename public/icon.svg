<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD966" />
      <stop offset="100%" stop-color="#F4C542" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#05080B" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(244,197,66,0.2)" stroke-width="4" />
  
  <!-- Motorcycle silhouette & speed icon -->
  <g transform="translate(56, 120) scale(1.6)" filter="url(#glow)">
    <!-- Wheel Rear -->
    <circle cx="50" cy="160" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
    <!-- Wheel Front -->
    <circle cx="200" cy="160" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
    <!-- Chassis -->
    <path d="M50 160 L100 100 L160 100 L200 160 M100 100 L125 150 L190 120 M160 100 L180 60 L210 60" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Seat -->
    <path d="M70 100 Q110 90 140 100" fill="none" stroke="#F5F5F5" stroke-width="8" stroke-linecap="round"/>
    <!-- Speed Trail -->
    <line x1="10" y1="90" x2="60" y2="90" stroke="#FFD966" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <line x1="20" y1="120" x2="40" y2="120" stroke="#FFD966" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
